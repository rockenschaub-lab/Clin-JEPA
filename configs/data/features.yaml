# Unharmonised source records (infusions, medication orders and
# administrations, procedures), read from the WeavEHR extraction as they are.
# Their item names are the source's own, so two datasets do not share them.
# The dataset profile (configs/data/<dataset>/dataset.yaml) says which extracted events feed
# them; a dataset without such a declaration contributes none.
raw_actions:
  enabled: true
