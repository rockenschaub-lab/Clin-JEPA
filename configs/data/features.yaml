# Shared WeavEHR concepts of both datasets, keyed by concept name. No
# source-specific code or clinical unit mapping belongs here.
#
# Each entry names a WeavEHR concept and says how its events are written:
#   concept       WeavEHR concept; also the event's variable_name
#   name          variable_name where two concepts form one variable
#   unit          unit WeavEHR must emit; any other unit stops the run
#   output_unit   unit label written out, where it differs from `unit`
#   display_name  name in the state and action text
# The order of the entries is their order in the text of an hour.
schema_version: 3
temporal:
  step_size_hours: 1
  max_steps: 336
  min_obs_per_stay: 1
