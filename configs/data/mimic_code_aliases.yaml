# Names of the original mimic-code pipeline for each WeavEHR concept. Used only
# by scripts/compare_mimic_demo.py to line the original events up with the
# concept-keyed ones; nothing in the pipeline reads this file.
#   unit    corrects an original unit label whose values already have this unit
#   levels  original text values of a categorical variable
# The six SOFA components have no entry: WeavEHR scores the current hour,
# mimic-code the worst value of the last 24 hours.
